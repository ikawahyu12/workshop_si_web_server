<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Mahasiswa</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5" style="max-width: 600px;">
        <div id="alert-container"></div>

        <div class="card shadow-sm">
            <div class="card-header bg-warning">
                <h5 class="mb-0">Edit Data Mahasiswa</h5>
            </div>
            <div class="card-body">
                <form id="form-edit" novalidate>
                    <div class="mb-3">
                        <label for="nim" class="form-label">NIM <span class="text-danger">*</span></label>
                        <input type="text" id="nim" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="nama" class="form-label">Nama Lengkap <span class="text-danger">*</span></label>
                        <input type="text" id="nama" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="prodi" class="form-label">Program Studi <span class="text-danger">*</span></label>
                        <input type="text" id="prodi" class="form-control" required>
                    </div>
                    <div class="d-flex justify-content-between">
                        <a href="dashboard.html" class="btn btn-secondary">Kembali</a>
                        <button type="submit" class="btn btn-warning">Simpan Perubahan</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
    <script>
        cekAutentikasi();
        const urlParams = new URLSearchParams(window.location.search);
        const idMahasiswa = urlParams.get('id');

        if (!idMahasiswa) {
            window.location.href = 'dashboard.html';
        } else {
            muatDataUntukEdit(idMahasiswa);
            document.getElementById('form-edit').addEventListener('submit', (e) => simpanPerubahan(e, idMahasiswa));
        }
    </script>
</body>
</html>
