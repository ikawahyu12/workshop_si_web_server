<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Dashboard - Sistem Informasi Akademik</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background-color: #f4f6f9;
        }

        .navbar-brand {
            font-weight: bold;
        }

        .dashboard-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.05);
        }

        .stat-card {
            border-left: 5px solid #0d6efd;
        }

        .table th {
            background-color: #f8f9fa;
        }

        .content {
            padding: 30px 0;
        }

        .action-buttons {
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">

            <a class="navbar-brand" href="dashboard.html">
                Sistem Informasi Akademik
            </a>

            <div class="d-flex align-items-center gap-3">

                <span class="text-white">
                    Halo, <strong id="usernameDisplay">Pengguna</strong>
                </span>

                <span class="badge bg-light text-primary" id="roleDisplay">
                    Role
                </span>

                <button
                    class="btn btn-light btn-sm"
                    id="logoutButton"
                >
                    Logout
                </button>

            </div>

        </div>
    </nav>

    <!-- Konten Dashboard -->
    <div class="container content">

        <div class="mb-4">
            <h2>Dashboard</h2>
            <p class="text-muted">
                Selamat datang di Sistem Informasi Akademik.
            </p>
        </div>

        <!-- Statistik -->
        <div class="row mb-4">

            <div class="col-md-4">

                <div class="card dashboard-card stat-card">
                    <div class="card-body">

                        <h6 class="text-muted">
                            Total Mahasiswa
                        </h6>

                        <h2 id="totalMahasiswa">
                            0
                        </h2>

                    </div>
                </div>

            </div>

        </div>

        <!-- Data Mahasiswa -->
        <div class="card dashboard-card">

            <div class="card-header bg-white d-flex justify-content-between align-items-center">

                <h5 class="mb-0">
                    Data Mahasiswa
                </h5>

                <button
                    class="btn btn-primary btn-sm"
                    id="addButton"
                    data-bs-toggle="modal"
                    data-bs-target="#mahasiswaModal"
                >
                    + Tambah Mahasiswa
                </button>

            </div>

            <div class="card-body">

                <div id="alertMessage"></div>

                <div class="table-responsive">

                    <table class="table table-bordered table-striped align-middle">

                        <thead>
                            <tr>
                                <th>No</th>
                                <th>NIM</th>
                                <th>Nama</th>
                                <th>Program Studi</th>
                                <th id="actionHeader">Aksi</th>
                            </tr>
                        </thead>

                        <tbody id="mahasiswaTable">
                            <tr>
                                <td colspan="5" class="text-center">
                                    Memuat data...
                                </td>
                            </tr>
                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

    <!-- Modal Tambah / Edit Mahasiswa -->
    <div
        class="modal fade"
        id="mahasiswaModal"
        tabindex="-1"
        aria-hidden="true"
    >

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title" id="modalTitle">
                        Tambah Mahasiswa
                    </h5>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                    ></button>

                </div>

                <div class="modal-body">

                    <form id="mahasiswaForm">

                        <input type="hidden" id="mahasiswaId">

                        <div class="mb-3">
                            <label for="nim" class="form-label">
                                NIM
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nim"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="nama" class="form-label">
                                Nama Mahasiswa
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="nama"
                                required
                            >
                        </div>

                        <div class="mb-3">
                            <label for="prodi" class="form-label">
                                Program Studi
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                id="prodi"
                                required
                            >
                        </div>

                        <button
                            type="submit"
                            class="btn btn-primary"
                            id="saveButton"
                        >
                            Simpan
                        </button>

                    </form>

                </div>

            </div>

        </div>

    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Dashboard JS -->
    <script src="../js/dashboard.js"></script>

</body>
</html>
